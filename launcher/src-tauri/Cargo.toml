[package]
name = "azura-launcher"
version = "0.4.3"
description = "Launcher for the Gears3-Azura native macOS port"
authors = ["Gears3-Azura contributors"]
license = "PolyForm-Strict-1.0.0"
edition = "2024"
rust-version = "1.90"

[lib]
# The library holds the app so the same code can later back other entry points; main.rs only calls it.
name = "azura_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.1"
sha2 = "0.10.9"
base64 = "0.22.1"
libc = "0.2"
toml = "1.1.8"
toml_edit = "0.25.17"
tauri-plugin-updater = "2.13.1"

# Controllers, to navigate the launcher (gamepad.rs): Apple's GameController framework on macOS,
# gilrs elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-game-controller = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
gilrs = "0.11"

# The processor, memory and graphics cards on Windows (system.rs): the registry, the memory status
# and SetupAPI's display adapters.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_Devices_DeviceAndDriverInstallation",
] }
