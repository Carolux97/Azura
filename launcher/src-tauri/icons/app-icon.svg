<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Azura launcher icon: a steel plate crossed by glowing imulsion veins, with a cog around an
    imulsion core. Original artwork. Source of every icon size: `npx tauri icon app-icon.svg`
    (run from launcher/src-tauri/icons/, with -o .).
    The plate follows the macOS icon grid: an 824 px rounded square centred on a 1024 px canvas.
  -->
  <defs>
    <radialGradient id="plate" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2c3036"/>
      <stop offset="0.6" stop-color="#16181b"/>
      <stop offset="1" stop-color="#0b0c0d"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a616a"/>
      <stop offset="1" stop-color="#1b1d20"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#9aa1aa"/>
      <stop offset="0.45" stop-color="#5b626b"/>
      <stop offset="1" stop-color="#2b2f34"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.35" stop-color="#ffd25a"/>
      <stop offset="0.75" stop-color="#ffb81c"/>
      <stop offset="1" stop-color="#d9750a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb81c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb81c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="plateClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Plate -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>

  <!-- Imulsion veins running under the cog -->
  <g clip-path="url(#plateClip)" filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M 100 760 C 230 700 300 760 400 690 S 560 600 640 640 S 820 760 924 700" stroke="#ffb81c" stroke-width="10" opacity="0.85"/>
    <path d="M 400 690 C 380 780 300 830 260 924" stroke="#ffd25a" stroke-width="6" opacity="0.7"/>
    <path d="M 640 640 C 700 560 760 520 924 470" stroke="#ffb81c" stroke-width="6" opacity="0.6"/>
    <path d="M 100 330 C 180 300 230 340 300 300" stroke="#d9750a" stroke-width="5" opacity="0.6"/>
  </g>

  <!-- Halo behind the core -->
  <circle cx="512" cy="512" r="250" fill="url(#halo)"/>

  <!-- Cog -->
  <path d="M 450.8,257.2 L 459.5,198.4 A 318 318 0 0 1 564.5,198.4 L 573.2,257.2 A 262 262 0 0 1 586.4,260.8 L 623.4,214.1 A 318 318 0 0 1 714.3,266.6 L 692.3,322.0 A 262 262 0 0 1 702.0,331.7 L 757.4,309.7 A 318 318 0 0 1 809.9,400.6 L 763.2,437.6 A 262 262 0 0 1 766.8,450.8 L 825.6,459.5 A 318 318 0 0 1 825.6,564.5 L 766.8,573.2 A 262 262 0 0 1 763.2,586.4 L 809.9,623.4 A 318 318 0 0 1 757.4,714.3 L 702.0,692.3 A 262 262 0 0 1 692.3,702.0 L 714.3,757.4 A 318 318 0 0 1 623.4,809.9 L 586.4,763.2 A 262 262 0 0 1 573.2,766.8 L 564.5,825.6 A 318 318 0 0 1 459.5,825.6 L 450.8,766.8 A 262 262 0 0 1 437.6,763.2 L 400.6,809.9 A 318 318 0 0 1 309.7,757.4 L 331.7,702.0 A 262 262 0 0 1 322.0,692.3 L 266.6,714.3 A 318 318 0 0 1 214.1,623.4 L 260.8,586.4 A 262 262 0 0 1 257.2,573.2 L 198.4,564.5 A 318 318 0 0 1 198.4,459.5 L 257.2,450.8 A 262 262 0 0 1 260.8,437.6 L 214.1,400.6 A 318 318 0 0 1 266.6,309.7 L 322.0,331.7 A 262 262 0 0 1 331.7,322.0 L 309.7,266.6 A 318 318 0 0 1 400.6,214.1 L 437.6,260.8 A 262 262 0 0 1 450.8,257.2 Z M 512,336 A 176 176 0 1 0 512,688 A 176 176 0 1 0 512,336 Z" fill="url(#steel)" fill-rule="evenodd" stroke="#14161a" stroke-width="6" filter="url(#shadow)"/>
  <!-- Rivets on the cog body -->
  <g fill="#c7ccd2" opacity="0.75">
    <circle cx="726.4" cy="569.5" r="9"/>
    <circle cx="669.0" cy="669.0" r="9"/>
    <circle cx="569.5" cy="726.4" r="9"/>
    <circle cx="454.5" cy="726.4" r="9"/>
    <circle cx="355.0" cy="669.0" r="9"/>
    <circle cx="297.6" cy="569.5" r="9"/>
    <circle cx="297.6" cy="454.5" r="9"/>
    <circle cx="355.0" cy="355.0" r="9"/>
    <circle cx="454.5" cy="297.6" r="9"/>
    <circle cx="569.5" cy="297.6" r="9"/>
    <circle cx="669.0" cy="355.0" r="9"/>
    <circle cx="726.4" cy="454.5" r="9"/>
  </g>

  <!-- Imulsion core -->
  <circle cx="512" cy="512" r="146" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="146" fill="none" stroke="#fff4c2" stroke-opacity="0.5" stroke-width="4"/>
  <ellipse cx="472" cy="452" rx="58" ry="34" fill="#fffbe6" opacity="0.55"/>

  <!-- Plate rim highlight -->
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
