# Gears3-Azura settings.
#
# The build installs this file beside the executable as azura.default.toml. The runtime loads it
# first, then azura.toml from the same folder (the player's settings, written by the launcher and
# the F4 menu), so azura.toml only needs the keys it changes. The build never overwrites
# azura.toml. Command-line flags (--name=value) override both files.
#
# Every key is a runtime setting (cvar) name.

# ---------- Graphics ----------
# GPU emulation plugin loaded at start-up. "xenos" translates the console GPU to the host's
# graphics API.
gpu_plugin = "xenos"
# Vulkan host render targets in EDRAM sample space (one texel per EDRAM sample), as Metal always
# does: switching an EDRAM region between MSAA modes needs no render target transfer. Without it
# characters and floors on Linux show noise and blocky dark patches, and the copies cost more GPU
# time.
edram_sample_space = true
# Host graphics API: "any" picks Metal on macOS and Vulkan on Linux; "vulkan" uses Vulkan on
# macOS too (through MoltenVK).
gpu_backend = "any"
# Shader compiler: "xsc" is our own compiler from the Xbox 360 shader microcode (MSL on Metal,
# SPIR-V on Vulkan with host render targets), with what it does not support yet falling back to
# "translator", the SPIR-V translator (through SPIRV-Cross on Metal) used before it. Not set here:
# the default is "xsc" on macOS and "translator" on Linux, where XSC is not checked yet.
# shader_compiler = "xsc"
# Run the vertex shader of screen-space draws without clipping (full-screen clears and passes)
# on the CPU to find how much of the EDRAM they really use. Without it such draws claim up to the
# whole EDRAM, and every render target in the way is copied out and back: in the campaign this
# cut the GPU time of render target transfers from ~10 to ~2 ms per frame.
execute_unclipped_draw_vs_on_cpu = true
# With async_shader_compilation, Vulkan skips the draws whose pipeline a background thread is still
# making. Present those frames anyway, as Metal does: an object may appear a few frames late, while
# not presenting them freezes the picture for as long as the pipelines take.
vulkan_async_skip_incomplete_frames = false

# ---------- CPU ----------
# Run guest functions the code generator did not find (indirect call targets it cannot see, jump
# table cases it does not detect) with the PowerPC interpreter instead of stopping the game. The
# log names each one and reports its cost every 10 seconds.
ppc_interpreter_fallback = true

# ---------- Display ----------
fullscreen = true
# Resolution the game is drawn at (the Video menu's Render resolution): auto, 1280x720, 1920x1080
# (macOS only), 2560x1440 or 3840x2160. It sets the draw resolution scale and the texture cache
# limits at start-up.
render_resolution = "auto"
# The Video menu's Upscaling preset: custom (render_resolution and the image scaling as set),
# native, quality, balanced or performance. A preset draws the game at the screen's resolution
# divided by 1, 1.5, 1.7 or 2 (the nearest render resolution, never below 1280x720) and scales it
# up with AMD FSR 1 (MetalFX on macOS) when that is below the screen's. It applies at start-up.
upscaling_preset = "custom"
# Extra sharpening of AMD CAS and AMD FSR 1, from 0.0 (the effect's own) to 1.0 (the most): the
# Video menu's Sharpness. It applies while the game runs.
upscaling_sharpness = 0.0
# The Video menu's Field of view: the base camera's horizontal angle in degrees, 80 (the game's),
# 85, 90, 95 or 100. Every gameplay camera mode is scaled in proportion. It applies while the game runs.
field_of_view = 80.0
# The Video menu's Film grain: the game's film grain noise. It applies while the game runs.
film_grain = true
# The Video menu's Depth of field and Dynamic shadows: the game's own settings, written while it
# runs. They are the game's most costly effects: on an M4 in combat, turning them off saves about
# 2 ms and 3 ms of the 10.5 ms of GPU time per frame.
depth_of_field = true
dynamic_shadows = true
# The Video menu's Bloom and Lens flares: the same, for effects that change the look rather than the
# frame rate. Its Ambient occlusion is not set here: it is on by default, except on Linux, where the
# game's ambient occlusion leaves black patches on surfaces.
bloom = true
lens_flares = true
# The Video menu's Performance overlay: off, fps for the game's frame rate in a corner of the game,
# detailed to add the game's CPU and GPU use, or advanced to add its memory use, a graph of frame
# times, the average frame rate and the 1% low.
performance_overlay = "off"
# Its corner (the Video menu's Overlay position): top_left, top_right, bottom_left or bottom_right.
performance_overlay_position = "top_right"
# Present the game in step with the display refresh (FIFO). The immediate and mailbox modes let
# the presenter repaint the same frame hundreds of times per second, taking GPU time from the game.
# On Windows the runtime allows mailbox unless this file's player copy (azura.toml) sets it: FIFO
# holds the game at 20 FPS there.
vulkan_allow_present_mode_immediate = false
vulkan_allow_present_mode_mailbox = false

# ---------- Localization ----------
# 1 = English, 2 = Japanese, 3 = German, 4 = French, 5 = Spanish, 6 = Italian,
# 7 = Korean, 8 = Traditional Chinese, 9 = Portuguese, 10 = Simplified Chinese, 11 = Polish, 12 = Russian.
user_language = 5

# ---------- Profile ----------
# Player gamertag shown in lobbies, menus and multiplayer (15 characters max).
user_name = "User"

# ---------- Network ----------
# "offline": no network link, so the game's System Link options stay greyed out.
# "system_link": play System Link (campaign co-op, Horde, Beast, private Versus) with the other
# computers of the local network.
# "online": the same, and the party options' Joinable and Invite only host a room on Alboria, our
# online service, for playing with friends over the internet: the room's code, shown in
# Manage/Invite, lets them join.
network_mode = "online"
# Alboria's control API, and the name and version this build gives it when signing in (the
# service refuses versions it no longer supports).
alboria_api_url = "https://api.alboria.org"
alboria_client = "azura/0.5.0"
# The party the game starts with, which the game keeps as the player chooses in the party options:
# joinable (the first time), invite_only, system_link or local. Joinable and Invite only host a
# room on Alboria; when Alboria does not answer the game starts in Local and this stays as it was.
startup_party = "joinable"
# Options > Connection's Direct connection: reach the other players of an Alboria room directly
# when the network allows it, with the relay as fallback. Lower latency, but they can learn this
# computer's public IP address. Takes effect from the next room.
alboria_direct = true
# Options > Connection's Show latency: the latency in the performance overlay's corner. A member of
# an Alboria room sees the round trip to the host and whether it is direct or goes through the
# relay; the host, which runs the game, and a game in no room see 0 ms.
latency_overlay = false
# This computer's IPv4 address on the local network System Link plays on (for example
# "192.168.1.20"). Empty: chosen automatically, preferring a home network address over a VPN or
# virtual adapter's. Set it when the log line "System Link: local network address" shows the wrong
# one; the log lists every interface just above it.
system_link_address = ""

# ---------- Input ----------
# Enable keyboard/mouse controller emulation. If a physical gamepad is plugged in,
# it works concurrently.
mnk_mode = true
mnk_mouse = true
# Mouse look turns the camera by about 0.044 degrees per pixel times this (Options, Keyboard and
# mouse, Mouse sensitivity).
mnk_sensitivity = 1.0

# Button prompts: "auto" (follows the device last used: keyboard/mouse, DualSense or Xbox),
# "playstation", "xbox" or "pc". With keyboard and mouse, each prompt shows the first key of the
# matching keybind below, so put the key you want shown first.
controller_icons = "auto"

# Mouse look while aiming and while zoomed in, as mnk_sensitivity is the rest of the time; moving
# the mouse forward looks down with mnk_invert_y; mnk_mouse_acceleration from 0 (none) to 1.
mnk_aim_sensitivity = 1.0
mnk_zoom_sensitivity = 1.0
mnk_invert_y = false
mnk_mouse_acceleration = 0.0
# Aim with a press to start and another to stop; zoom while the bind is held (the game's own zoom
# is a click in and a click out); roadie run with a press of keybind_run to start and another to
# stop.
mnk_aim_toggle = false
mnk_zoom_hold = false
mnk_run_toggle = false

# ---------- Keybinds (Xbox 360 -> PC Gears of War 3) ----------
# Options, Keyboard and mouse changes them in the game. The defaults follow Gears 5 on PC. Fixed,
# whatever is bound: Escape and Return (Start), Backspace (B, back in menus) and the arrow keys
# (D-pad). Mouse buttons: LMB, RMB, MMB, Mouse4, Mouse5, WheelUp, WheelDown.
keybind_a = "Space"                    # A: cover / evade / mantle (hold: roadie run)
keybind_b = "F"                        # B: melee / grenade tag (hold: chainsaw / bayonet)
keybind_x = "E"                        # X: use / revive / meat shield (hold: pick up)
keybind_y = "C,V"                      # Y: point of interest / curb stomp (hold: execute)
keybind_right_trigger = "LMB"          # RT: shoot / throw grenade
keybind_left_trigger = "RMB"           # LT: aim
keybind_right_shoulder = "R"           # RB: reload / active reload
keybind_left_shoulder = "Shift"        # LB: Tac/Com / objectives
keybind_lstick_up = "W"                # Left stick up: forward
keybind_lstick_down = "S"              # Left stick down: back
keybind_lstick_left = "A"              # Left stick left
keybind_lstick_right = "D"             # Left stick right
keybind_lstick_press = "Ctrl,Q"        # L3: crouch in cover / mark a target while aiming
keybind_rstick_press = "MMB,Z"         # R3: zoom while aiming
keybind_dpad_left = "1,WheelUp"        # D-pad left: weapon 1
keybind_dpad_right = "2,WheelDown"     # D-pad right: weapon 2
keybind_dpad_down = "3"                # D-pad down: pistol
keybind_dpad_up = "4"                  # D-pad up: grenades
keybind_back = "Tab"                   # Back: skip cinematics / scoreboard
keybind_run = ""                       # Roadie run on a key of its own (holds A)

