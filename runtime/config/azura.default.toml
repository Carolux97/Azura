# Gears3-Azura settings.
#
# The build installs this file beside the executable as azura.default.toml. The runtime loads it
# first, then azura.toml from the same folder (the player's settings, written by the launcher and
# the F4 menu), so azura.toml only needs the keys it changes. The build never overwrites
# azura.toml. Command-line flags (--name=value) override both files.
#
# Every key is a runtime setting (cvar) name.

# ---------- Graphics ----------
# GPU emulation plugin loaded at start-up. "xenos" translates the console GPU to the host's
# graphics API.
gpu_plugin = "xenos"
# Host graphics API: "any" picks Metal on macOS and Vulkan on Linux; "vulkan" uses Vulkan on
# macOS too (through MoltenVK).
gpu_backend = "any"
# Shader compiler: "xsc" is our own compiler from the Xbox 360 shader microcode (MSL on Metal,
# SPIR-V on Vulkan with host render targets), with what it does not support yet falling back to
# "translator", the SPIR-V translator (through SPIRV-Cross on Metal) used before it. Not set here:
# the default is "xsc" on macOS and "translator" on Linux, where XSC is not checked yet.
# shader_compiler = "xsc"
# Run the vertex shader of screen-space draws without clipping (full-screen clears and passes)
# on the CPU to find how much of the EDRAM they really use. Without it such draws claim up to the
# whole EDRAM, and every render target in the way is copied out and back: in the campaign this
# cut the GPU time of render target transfers from ~10 to ~2 ms per frame.
execute_unclipped_draw_vs_on_cpu = true

# ---------- Display ----------
fullscreen = false
# Present the game in step with the display refresh (FIFO). The immediate and mailbox modes let
# the presenter repaint the same frame hundreds of times per second, taking GPU time from the game.
vulkan_allow_present_mode_immediate = false
vulkan_allow_present_mode_mailbox = false

# ---------- Localization ----------
# 1 = English, 2 = Japanese, 3 = German, 4 = French, 5 = Spanish, 6 = Italian,
# 7 = Korean, 8 = Traditional Chinese, 9 = Portuguese, 10 = Simplified Chinese, 11 = Polish, 12 = Russian.
user_language = 5

# ---------- Profile ----------
# Player gamertag shown in lobbies, menus and multiplayer (15 characters max).
user_name = "User"

# ---------- Input ----------
# Enable keyboard/mouse controller emulation. If a physical gamepad is plugged in,
# it works concurrently.
mnk_mode = true
mnk_mouse = true
mnk_sensitivity = 1.0

# Button prompts: "auto" (follows the device last used: keyboard/mouse, DualSense or Xbox),
# "playstation", "xbox" or "pc". With keyboard and mouse, each prompt shows the first key of the
# matching keybind below, so put the key you want shown first.
controller_icons = "auto"

# ---------- Keybinds (Xbox 360 -> PC Gears of War 3) ----------
keybind_a = "Space"                    # A: cover / roll / sprint / confirm in menus
keybind_b = "F,Backspace"              # B: melee (F) / back in menus (Backspace)
keybind_x = "E"                        # X: interact / pick up ammo or weapons / revive
keybind_y = "V,C"                      # Y: point of interest / execution
keybind_right_trigger = "LMB"          # RT: fire (left click)
keybind_left_trigger = "RMB,Q"         # LT: aim (right click)
keybind_right_shoulder = "R"           # RB: reload / active reload
keybind_left_shoulder = "Q"            # LB: Tac-Com (view objectives and squad)
keybind_lstick_up = "W"                # Left stick up
keybind_lstick_down = "S"              # Left stick down
keybind_lstick_left = "A"              # Left stick left
keybind_lstick_right = "D"             # Left stick right
keybind_lstick_press = "Shift,Control" # L3: press the left stick
keybind_rstick_press = "MMB,Z"         # R3: zoom while aiming (middle click or Z)
keybind_dpad_up = "Up,4"               # D-pad up: grenades (4) / menu up
keybind_dpad_down = "Down,3"           # D-pad down: pistol (3) / menu down
keybind_dpad_left = "Left,1"           # D-pad left: weapon 1 (1) / menu left
keybind_dpad_right = "Right,2"         # D-pad right: weapon 2 (2) / menu right
keybind_start = "Return,Escape"        # Start: Enter (shown on prompts) / Escape (pause)
keybind_back = "Tab"                   # Back: scoreboard

