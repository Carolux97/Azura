<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Azura runtime icon: a cartoon steel keycap, in the style of the PC control glyphs, split by
    Lambent cracks, with the cog-and-skull emblem on its face. Flat cel shading with ink outlines.
    Follows the macOS icon grid: an 824 px rounded square centred on a 1024 px canvas.
    Generated by runtime/assets/make_icon.py; edit the shapes there rather than this file.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.35" stop-color="#ffc21a"/>
      <stop offset="1" stop-color="#ffb81c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faceClip"><rect x="150" y="128" width="724" height="700" rx="150"/></clipPath>

    <!-- The emblem silhouette: ring plus skull, reused for outline, fill and cel shading -->
    <g id="omen">
      <path d="M 505.2,242.1 L 530.5,195.6 A 283 283 0 0 1 637.2,224.2 L 635.8,277.1 A 236 236 0 0 1 674.0,306.4 L 724.8,291.4 A 283 283 0 0 1 780.0,387.0 L 741.6,423.5 A 236 236 0 0 1 747.9,471.2 L 794.4,496.5 A 283 283 0 0 1 765.8,603.2 L 712.9,601.8 A 236 236 0 0 1 683.6,640.0 L 698.6,690.8 A 283 283 0 0 1 603.0,746.0 L 566.5,707.6 A 236 236 0 0 1 518.8,713.9 L 493.5,760.4 A 283 283 0 0 1 386.8,731.8 L 388.2,678.9 A 236 236 0 0 1 350.0,649.6 L 299.2,664.6 A 283 283 0 0 1 244.0,569.0 L 282.4,532.5 A 236 236 0 0 1 276.1,484.8 L 229.6,459.5 A 283 283 0 0 1 258.2,352.8 L 311.1,354.2 A 236 236 0 0 1 340.4,316.0 L 325.4,265.2 A 283 283 0 0 1 421.0,210.0 L 457.5,248.4 A 236 236 0 0 1 505.2,242.1 Z M 512,306 A 172 172 0 1 0 512,650 A 172 172 0 1 0 512,306 Z" fill-rule="evenodd"/>
      <path d="M 214 96 C 190 128 184 182 206 224 C 216 244 232 256 240 270 L 246 292 C 262 308 302 312 332 302 C 354 294 366 272 364 246 C 376 222 376 186 364 156 C 356 132 344 112 332 96 L 326 80 L 222 82 Z" transform="translate(512 478) scale(1.5636) translate(-290 -200)" vector-effect="non-scaling-stroke"/>
    </g>
    <!-- Cel shading: the silhouette minus a copy of itself nudged towards the light (top left) -->
    <mask id="shadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use xlink:href="#omen" fill="#fff"/>
      <use xlink:href="#omen" fill="#000" transform="translate(-16 -18)"/>
    </mask>
    <mask id="lightMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use xlink:href="#omen" fill="#fff"/>
      <use xlink:href="#omen" fill="#000" transform="translate(9 10)"/>
    </mask>
  </defs>

  <!-- Keycap body: the sides of the key, with Lambent light seeping out at the bottom -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#1f2125"/>
  </g>
  <path d="M 140 840 Q 512 960 884 840 L 884 880 Q 512 990 140 880 Z" fill="#ffb81c" opacity="0.25" filter="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#0b0b0d" stroke-width="16"/>
  <path d="M 176 862 Q 512 940 848 862" fill="none" stroke="#ffc21a" stroke-width="10" stroke-linecap="round"/>
  <path d="M 176 862 Q 512 940 848 862" fill="none" stroke="#fff1a8" stroke-width="3" stroke-linecap="round"/>

  <!-- Key face: flat steel with one cel highlight band -->
  <rect x="150" y="128" width="724" height="700" rx="150" fill="#3b4047"/>
  <g clip-path="url(#faceClip)">
    <path d="M 150 128 L 874 128 L 874 300 C 700 250 420 230 150 330 Z" fill="#454b53"/>
    <path d="M 150 700 C 400 760 650 780 874 720 L 874 828 L 150 828 Z" fill="#30343a"/>
    <!-- Rivets -->
    <g fill="#5a6068" stroke="#0b0b0d" stroke-width="5">
      <circle cx="820" cy="190" r="14"/>
      <circle cx="204" cy="770" r="14"/>
    </g>
    <g fill="#9aa1a9"><circle cx="815" cy="185" r="4"/><circle cx="199" cy="765" r="4"/></g>

    <!-- Lambent cracks: ink outline, hot fill, white-hot core -->
    <g filter="url(#glow)" opacity="0.55" fill="#ffb81c">
      <path d="M 146.6,273.1 L 197.6,286.0 L 212.4,260.4 L 243.7,288.9 L 241.6,322.7 L 281.6,344.2 L 299.4,380.2 L 300.6,379.8 L 286.4,339.8 L 250.4,317.3 L 256.3,283.1 L 215.6,243.6 L 194.4,266.0 L 153.4,250.9 Z"/><path d="M 871.6,678.6 L 819.9,692.0 L 801.9,734.5 L 756.5,730.0 L 740.4,774.3 L 701.8,787.6 L 689.4,827.8 L 690.6,828.2 L 706.2,792.4 L 747.6,781.7 L 763.5,742.0 L 810.1,749.5 L 832.1,708.0 L 876.4,701.4 Z"/>
    </g>
    <g stroke="#0b0b0d" stroke-width="7" stroke-linejoin="round" fill="#ffc21a">
      <path d="M 146.6,273.1 L 197.6,286.0 L 212.4,260.4 L 243.7,288.9 L 241.6,322.7 L 281.6,344.2 L 299.4,380.2 L 300.6,379.8 L 286.4,339.8 L 250.4,317.3 L 256.3,283.1 L 215.6,243.6 L 194.4,266.0 L 153.4,250.9 Z"/><path d="M 220.4,256.1 L 242.6,214.7 L 226.6,175.8 L 225.4,176.2 L 233.4,213.3 L 207.6,247.9 Z"/><path d="M 871.6,678.6 L 819.9,692.0 L 801.9,734.5 L 756.5,730.0 L 740.4,774.3 L 701.8,787.6 L 689.4,827.8 L 690.6,828.2 L 706.2,792.4 L 747.6,781.7 L 763.5,742.0 L 810.1,749.5 L 832.1,708.0 L 876.4,701.4 Z"/><path d="M 800.1,746.8 L 829.7,777.7 L 839.4,828.1 L 840.6,827.9 L 838.3,774.3 L 811.9,737.2 Z"/><path d="M 657.8,130.3 L 671.1,159.8 L 659.0,186.8 L 687.6,206.5 L 688.4,205.5 L 665.0,185.2 L 680.9,160.2 L 670.2,125.7 Z"/>
    </g>
    <g fill="#fff1a8" opacity="0.9">
      <path d="M 148.7,266.4 L 196.6,279.7 L 213.5,254.8 L 248.3,286.8 L 245.4,319.9 L 246.6,320.1 L 251.7,285.2 L 214.5,249.2 L 195.4,272.3 L 151.3,257.6 Z"/>
      <path d="M 873.1,685.5 L 823.7,697.0 L 804.6,739.5 L 759.0,734.3 L 743.4,777.8 L 744.6,778.2 L 761.0,737.7 L 807.4,744.5 L 828.3,703.0 L 874.9,694.5 Z"/>
    </g>
    <!-- Broken corners where the Lambent has burst through -->
    <path d="M 150 128 L 300 128 L 284 158 L 300 176 L 262 196 L 240 186 L 214 220 L 182 214 L 150 250 Z" fill="#ffc21a" stroke="#0b0b0d" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 150 128 L 236 128 L 226 150 L 200 160 L 186 186 L 150 194 Z" fill="#fff1a8"/>
    <path d="M 874 828 L 724 828 L 744 800 L 770 804 L 790 776 L 822 770 L 836 740 L 874 730 Z" fill="#ffc21a" stroke="#0b0b0d" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 874 828 L 800 828 L 816 808 L 840 800 L 852 776 L 874 772 Z" fill="#fff1a8"/>
  </g>
  <rect x="150" y="128" width="724" height="700" rx="150" fill="none" stroke="#0b0b0d" stroke-width="10"/>

  <!-- Emblem -->
  <circle cx="512" cy="478" r="172" fill="#141518"/>
  <use xlink:href="#omen" fill="#0b0b0d" stroke="#0b0b0d" stroke-width="26" stroke-linejoin="round"/>
  <use xlink:href="#omen" fill="#6d737b"/>
  <g mask="url(#shadeMask)"><rect width="1024" height="1024" fill="#474c53"/></g>
  <g mask="url(#lightMask)"><rect width="1024" height="1024" fill="#a9afb7"/></g>

  <!-- Face: sockets, nose and the grimace, outlined in ink -->
  <g transform="translate(512 478) scale(1.5636) translate(-290 -200)" stroke="#0b0b0d" stroke-width="5" stroke-linejoin="round" vector-effect="non-scaling-stroke">
    <path d="M 224 184 L 270 192 L 272 208 L 258 222 L 238 220 L 226 204 Z M 292 176 L 336 162 L 342 178 L 332 196 L 310 202 L 294 192 Z" fill="#141518" vector-effect="non-scaling-stroke" stroke-width="9"/>
    <path d="M 268 214 L 292 210 L 290 234 L 280 242 L 270 232 Z" fill="#141518" vector-effect="non-scaling-stroke" stroke-width="9"/>
    <path d="M 238 246 C 276 242 322 236 360 230 L 356 266 C 326 276 282 282 250 282 Z" fill="#141518" vector-effect="non-scaling-stroke" stroke-width="9"/>
    <path d="M 242 245.7 h 12 v 13 q -6 6 -12 0 Z M 258 243.6 h 12 v 16 q -6 6 -12 0 Z M 274 241.5 h 12 v 15 q -6 6 -12 0 Z M 290 239.4 h 12 v 17 q -6 6 -12 0 Z M 306 237.3 h 12 v 15 q -6 6 -12 0 Z M 322 235.2 h 12 v 16 q -6 6 -12 0 Z M 338 233.1 h 12 v 12 q -6 6 -12 0 Z M 258 278.9 h 12 v -6 q -6 -6 -12 0 Z M 282 275.3 h 12 v -8 q -6 -6 -12 0 Z M 306 271.6 h 12 v -7 q -6 -6 -12 0 Z M 330 268.0 h 12 v -5 q -6 -6 -12 0 Z" fill="#c9cdd2" vector-effect="non-scaling-stroke" stroke-width="5"/>
    <!-- Lambent embers in the sockets -->
    <circle cx="250" cy="204" r="14" fill="url(#ember)" stroke="none"/>
    <circle cx="316" cy="183" r="13" fill="url(#ember)" stroke="none"/>
  </g>
</svg>

