# ReXGlue project manifest for Gears of War 3 (Xbox 360), World edition (media ID 58122AD6).
#
# `rexglue codegen` reads this file and translates the game's PowerPC code (game/default.xex) into
# C++ under generated/. The generated code is derived from your own copy of the game and is never
# committed. versions.toml (at the repository root) maps each known default.xex to its manifest;
# scripts/build.sh uses it to pick this file.
#
# Every manifest keeps project name "azura": the generated init header is named after it.

[project]
name = "azura"
sdk_version = "0.10.0"
game_root = "game"

[entrypoint]
file_path = "game/default.xex"
out_directory_path = "generated/default"
includes = []

# The guest's non-volatile registers (r14-r31) are C++ local variables of each recompiled function
# instead of fields of the shared context, so the compiler can keep them in host registers. The
# calls to the guest's register save and restore helpers (__savegprlr_N, __restgprlr_N) are then
# left out: the locals already preserve the values.
non_volatile_as_local = true

# No function entry hints and no jump table entries: functions the automatic discovery misses
# (indirect call targets, tail-call targets) and jump table cases it does not detect run in the
# runtime's PowerPC interpreter (ppc_interpreter_fallback, docs/ppc-interpreter-design.md). The
# runtime log names each function it interprets ("Interpreting guest function 0x..."); one can be
# added here as `0xADDRESS = {}` under [entrypoint.functions] to recompile it, which is only worth
# it if it costs noticeable time (the log also reports that every 10 seconds).

# Mid-function hooks: calls into runtime/src code at a given guest address.

# Rendering thread, right before it reads the vtable of the next render command
# (lwz r10,0(r18) in sub_823F4238): orders it after the write pointer read. See
# runtime/src/render_queue.cpp.
[[entrypoint.midasm_hook]]
address = 0x823F42D8
name = "AzuraCheckRenderCommand"
registers = ["r18"]

# "Disable Ambient Occlusion" (Linux only): right after each `lwz r11,1040(r10)` the community fix
# replaces with `li r11,0`, in sub_82762C30 and sub_827C9610. r10 is the engine's settings object,
# which the Video options write. See runtime/src/ambient_occlusion.cpp.
[[entrypoint.midasm_hook]]
address = 0x82762C54
name = "AzuraDisableAmbientOcclusion"
registers = ["r10", "r11"]
after_instruction = true

[[entrypoint.midasm_hook]]
address = 0x827C9628
name = "AzuraDisableAmbientOcclusion"
registers = ["r10", "r11"]
after_instruction = true
