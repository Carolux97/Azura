# ReXGlue project manifest for Gears of War 3 (Xbox 360), World edition (media ID 58122AD6).
#
# `rexglue codegen` reads this file and translates the game's PowerPC code (game/default.xex) into
# C++ under generated/. The generated code is derived from your own copy of the game and is never
# committed. versions.toml (at the repository root) maps each known default.xex to its manifest;
# scripts/build.sh uses it to pick this file.
#
# Every manifest keeps project name "azura": the generated init header is named after it.

[project]
name = "azura"
sdk_version = "0.10.0"
game_root = "game"

[entrypoint]
file_path = "game/default.xex"
out_directory_path = "generated/default"
includes = []

# Jump tables that detection under-counts. Bink's video decoder dispatches through an 11-entry
# table whose index is computed as (bits & 3) + 7, so detection only finds entries 0-3 and the
# generated switch traps on the rest. Labels read from the table in game memory (0x82FDCF1C).
[[entrypoint.switch_tables]]
address = 0x82FDCF18
register = 7
labels = [0x82FDCF48, 0x82FDCF64, 0x82FDD0E4, 0x82FDD264, 0x82FDD3E4, 0x82FDD564, 0x82FDD6E4,
          0x82FDD864, 0x82FDD9E4, 0x82FDDBB0, 0x82FDDD7C]

# Function entry hints: addresses that the automatic function discovery misses. They are found by
# running the game and reading the runtime log, and they only match the default.xex this manifest
# is for (see versions.toml).
[entrypoint.functions]
# Targets of tail-call branches (`b`) that discovery misses because nothing calls them with `bl`.
# Reported by codegen as UnresolvedCall.
0x82DB80F0 = {}
0x82DCE010 = {}

# Indirect call targets (function pointers, vtables) that static discovery cannot see. Found by
# running the game: the runtime stops with "Call to invalid or unregistered function at guest
# address ...".
0x82B21F30 = {}
0x823D4F78 = {}
0x82D057A8 = {}
0x8271C710 = {}
0x82D37198 = {}
0x82B1BAC0 = {}
0x82B222D8 = {}
0x822CDF50 = {}
0x82B22EC8 = {}
0x82B82BA8 = {}
0x82C690A0 = {}
0x82C0AE58 = {}
0x82C0AD80 = {}
0x82C79B60 = {}
